    16.12. To change the number and the boundaries of regional conferences, and to change the number and the boundaries of
    jurisdictional conferences upon the consent of a majority of the annual conferences in each jurisdictional conference involved.
    16.17. To legislate what is non-adaptable for regional conferences by a 60% majority vote, while respecting the powers given to
    regional conferences according to ¶31.5.
