textOld: |-
    The bishops shall have residential and presidential supervision in the jurisdictional or central conferences in which they are elected or to which they are transferred. Bishops may be transferred from one jurisdiction to another jurisdiction for presidential and residential supervision under the following conditions: (1) The transfer of bishops may be on either of two bases: (a) a jurisdiction that receives a bishop by transfer from another jurisdiction may transfer to that jurisdiction or to a third jurisdiction one of its own bishops eligible for transfer, so that the number transferred in by each jurisdiction shall be balanced by the number transferred out; or (b) a jurisdiction may receive a bishop from another jurisdiction and not transfer out a member of its own College of Bishops. (2) No bishop shall be transferred unless that bishop shall have specifically consented. (3) No bishop shall be eligible for transfer unless the bishop shall have served one quadrennium in the jurisdiction that elected the bishop to the episcopacy. (4) All such transfers shall require the approval by a majority vote of the members present and voting of the jurisdictional committees on episcopacy of the jurisdictions that are involved. After the above procedures have been followed, the transferring bishop shall become a member of the receiving College of Bishops and shall be subject to residential assignment by that jurisdictional conference. A bishop may be assigned by the Council of Bishops for presidential service or other temporary service in another jurisdiction than that which elected the bishop, provided that the request is made by a majority of the bishops in the jurisdiction of the proposed service. In the case of an emergency in any jurisdiction or central conference through the death or disability of a bishop or other cause, the Council of Bishops may assign a bishop from another jurisdiction or central conference to the work of the said jurisdiction or central conference, with the consent of a majority of the bishops of that jurisdiction or central conference.
textNew: |-
    The bishops shall have residential and presidential supervision in their respective regional conference or jurisdiction,
    if a regional conference has jurisdictions, in which they are elected or to which they are transferred. Bishops may be transferred
    from one jurisdiction to another jurisdiction for presidential and residential supervision under the following conditions: (1) The
    transfer of bishops may be on either of two bases: (a) a jurisdiction that receives a bishop by transfer from another jurisdiction
    may transfer to that jurisdiction or to a third jurisdiction one of its own bishops eligible for transfer, so that the number transferred
    in by each jurisdiction shall be balanced by the number transferred out; or (b) a jurisdiction may receive a bishop from another
    jurisdiction and not transfer out a member of its own College of Bishops. (2) No bishop shall be transferred unless that bishop shall
    have specifically consented. (3) No bishop shall be eligible for transfer unless the bishop shall have served one quadrennium in
    the jurisdiction that elected the bishop to the episcopacy. (4) All such transfers shall require the approval by a majority vote of the
    members present and voting of the jurisdictional committees on episcopacy of the jurisdictions that are involved. After the above
    procedures have been followed, the transferring bishop shall become a member of the receiving College of Bishops and shall be
    subject to residential assignment by that jurisdictional conference.
    A bishop may be assigned by the Council of Bishops for presidential service or other temporary service in another jurisdiction than
    that which elected the bishop, provided that the request is made by a majority of the bishops in the jurisdiction of the proposed
    service.
    In the case of an emergency in any regional conference or jurisdiction, if a regional conference has jurisdictions, through the death
    or disability of a bishop or other cause, the Council of Bishops may assign a bishop from another regional conference or jurisdiction,
    if a regional conference has jurisdictions, to the work of the said regional conference or jurisdiction, if a regional conference has
    jurisdictions, with the consent of a majority of the bishops of that regional conference or jurisdiction, if a regional conference has
    jurisdictions.
