textOld: |-
    The General Conference shall fix the ratio of representation in the General, jurisdictional, and central conferences from the annual conferences, missionary conferences, and the provisional annual conferences, computed on a two-factor basis: (1) the number of clergy members of the annual conference and the missionary conference, and (2) the number of professing members in the annual conference and the missionary conference, provided that each annual conference, missionary conference, or provisional annual conference shall be entitled to at least one clergy and one lay delegate in the General Conference and also in the jurisdictional or central conference.
textNew: |-
    The General Conference shall fix the ratio of representation in the General and regional conferences from the
    annual conferences, missionary conferences, and the provisional annual conferences, computed on a two-factor basis: (1) the
    number of clergy members of the annual conference and the missionary conference, and (2) the number of professing members in
    the annual conference and the missionary conference, provided that each annual conference, missionary conference, or provisional
    annual conference shall be entitled to at least one clergy and one lay delegate in the General Conference and also in the regional
    conference.
    In a regional conference with jurisdictions, the regional conference shall fix the ratio of representation in its jurisdictional conferences
    from the annual conferences, missionary conferences, and the provisional annual conferences, computed on a two-factor basis:
    (1) the number of clergy members of the annual conference and the missionary conference, and (2) the number of professing
    members in the annual conference and the missionary conference, provided that each annual conference, missionary conference,
    or provisional annual conference shall be entitled to at least one clergy and one lay delegate in the jurisdictional conference and
    further provided that all general and regional conference delegates will be members of their respective jurisdictional conferences.
